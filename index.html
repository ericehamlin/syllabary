<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="stylesheets/syllabary.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div id="syllabary-container"></div>
<script type="module">
    import Syllabary from './src/Syllabary.js';

    // URL query values arrive as strings; turn them into the types the app expects.
    const coerce = (value) => {
        if (value === 'true') return true;
        if (value === 'false') return false;
        return value !== '' && !isNaN(value) ? Number(value) : value;
    };

    const options = {};
    for (const [key, value] of new URLSearchParams(window.location.search)) {
        options[key] = coerce(value);
    }
    options.containerId = 'syllabary-container';

    Syllabary.start(options);
</script>
<video src='audio/test-autoplay.mp3' />
</body>
</html>
